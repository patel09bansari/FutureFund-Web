<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutureFund | Step 5: Financial Goals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body class="bg-secondary-theme">
    
    <nav class="navbar fintech-nav py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-5 text-primary-theme d-flex align-items-center gap-2" href="../../index.html">
                <i class="fas fa-shield-alt text-success" style="color: var(--accent-secondary) !important;"></i> FutureFund Planner
            </a>
            <div class="ms-auto">
                <a href="../../index.html" class="btn btn-sm btn-outline-fintech">Save & Exit</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <!-- Progress Indicator -->
                <div class="d-flex justify-content-between align-items-center mb-4 position-relative">
                    <div class="progress position-absolute w-100" style="height: 2px; top: 50%; z-index: 1;">
                        <div class="progress-bar" role="progressbar" style="width: 80%; background-color: var(--accent-primary);"></div>
                    </div>
                    
                    <div class="rounded-circle d-flex align-items-center justify-content-center position-relative z-3 fw-bold bg-white text-primary border" style="width: 40px; height: 40px; border-color: var(--accent-primary) !important;"><i class="fas fa-check"></i></div>
                    <div class="rounded-circle d-flex align-items-center justify-content-center position-relative z-3 fw-bold bg-white text-primary border" style="width: 40px; height: 40px; border-color: var(--accent-primary) !important;"><i class="fas fa-check"></i></div>
                    <div class="rounded-circle d-flex align-items-center justify-content-center position-relative z-3 fw-bold bg-white text-primary border" style="width: 40px; height: 40px; border-color: var(--accent-primary) !important;"><i class="fas fa-check"></i></div>
                    <div class="rounded-circle d-flex align-items-center justify-content-center position-relative z-3 fw-bold bg-white text-primary border" style="width: 40px; height: 40px; border-color: var(--accent-primary) !important;"><i class="fas fa-check"></i></div>
                    <div class="rounded-circle d-flex align-items-center justify-content-center position-relative z-3 fw-bold" style="width: 40px; height: 40px; background-color: var(--accent-primary); color: white;">5</div>
                    <div class="rounded-circle d-flex align-items-center justify-content-center position-relative z-3 bg-white border fw-bold text-muted-theme" style="width: 40px; height: 40px; border-color: var(--border-color) !important;">6</div>
                </div>
                
                <p class="text-center text-muted-theme fw-medium mb-5">Step 5: Financial Goals</p>

                <div class="fintech-card p-5">
                    <h2 class="h3 mb-4">What are you saving for?</h2>
                    <p class="text-secondary-theme mb-4">Add your goals below (e.g., House, Car, Retirement, Vacation).</p>
                    
                    <form id="step5-form" data-step="5">
                        
                        <div id="goalsContainer">
                            <!-- Goal items injected via JS -->
                        </div>
                        
                        <div class="text-center mt-3">
                            <button type="button" class="btn btn-outline-fintech" id="addGoalBtn"><i class="fas fa-plus me-2"></i>Add Another Goal</button>
                        </div>

                        <div class="d-flex justify-content-between mt-5 pt-4 border-top" style="border-color: var(--border-color) !important;">
                            <a href="step4-position.html" class="btn btn-outline-fintech">Back</a>
                            <button type="submit" class="btn btn-primary-fintech px-5">Continue <i class="fas fa-arrow-right ms-2"></i></button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../../js/storage.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/planner.js"></script>
    <script>
        // Specific logic for dynamic goals
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('goalsContainer');
            const addBtn = document.getElementById('addGoalBtn');
            let goalCount = 0;
            
            function createGoalHTML(id, data = {}) {
                return `
                <div class="goal-item p-4 border rounded mb-3 bg-white" id="goal-${id}" style="border-color: var(--border-color) !important;">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="mb-0 fw-semibold">Goal #${id}</h5>
                        ${id > 1 ? `<button type="button" class="btn btn-sm text-danger remove-goal" data-id="${id}"><i class="fas fa-trash"></i></button>` : ''}
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-medium small">Goal Name</label>
                            <input type="text" class="form-control" name="goalName[]" required placeholder="e.g. Dream Home" value="${data.name || ''}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-medium small">Target Amount</label>
                            <div class="input-group">
                                <span class="input-group-text">₹</span>
                                <input type="number" class="form-control" name="goalAmount[]" required min="1000" placeholder="5000000" value="${data.amount || ''}">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-medium small">Target Year</label>
                            <input type="number" class="form-control" name="goalYear[]" required min="${new Date().getFullYear()}" placeholder="${new Date().getFullYear() + 5}" value="${data.year || ''}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-medium small">Priority</label>
                            <select class="form-select" name="goalPriority[]" required>
                                <option value="High" ${data.priority === 'High' ? 'selected' : ''}>High (Must achieve)</option>
                                <option value="Medium" ${data.priority === 'Medium' || !data.priority ? 'selected' : ''}>Medium (Want to achieve)</option>
                                <option value="Low" ${data.priority === 'Low' ? 'selected' : ''}>Low (Nice to have)</option>
                            </select>
                        </div>
                    </div>
                </div>`;
            }
            
            function addGoal(data = {}) {
                goalCount++;
                container.insertAdjacentHTML('beforeend', createGoalHTML(goalCount, data));
                
                // Attach remove event
                const removeBtns = container.querySelectorAll('.remove-goal');
                removeBtns.forEach(btn => {
                    btn.onclick = function() {
                        document.getElementById(`goal-${this.getAttribute('data-id')}`).remove();
                    };
                });
            }
            
            addBtn.addEventListener('click', () => addGoal());
            
            // Try load existing goals from auto-save
            const existingData = FutureFundStorage.get('planner_step5');
            if (existingData && existingData.goals && existingData.goals.length > 0) {
                existingData.goals.forEach(g => addGoal(g));
            } else {
                addGoal(); // Default 1 empty goal
            }
        });
    </script>
</body>
</html>
