<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutureFund | Step 1: Personal Profile</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body class="bg-secondary-theme">
    
    <!-- Simple Navbar for Wizard -->
    <nav class="navbar fintech-nav py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-5 text-primary-theme d-flex align-items-center gap-2" href="../../index.html">
                <i class="fas fa-shield-alt text-success" style="color: var(--accent-secondary) !important;"></i> FutureFund Planner
            </a>
            <div class="ms-auto">
                <a href="../../index.html" class="btn btn-sm btn-outline-fintech">Save & Exit</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <!-- Progress Indicator -->
                <div class="d-flex justify-content-between align-items-center mb-4 position-relative">
                    <div class="progress position-absolute w-100" style="height: 2px; top: 50%; z-index: 1;">
                        <div class="progress-bar" role="progressbar" style="width: 0%; background-color: var(--accent-primary);"></div>
                    </div>
                    
                    <div class="rounded-circle d-flex align-items-center justify-content-center position-relative z-3 fw-bold" style="width: 40px; height: 40px; background-color: var(--accent-primary); color: white;">1</div>
                    <div class="rounded-circle d-flex align-items-center justify-content-center position-relative z-3 bg-white border fw-bold text-muted-theme" style="width: 40px; height: 40px; border-color: var(--border-color) !important;">2</div>
                    <div class="rounded-circle d-flex align-items-center justify-content-center position-relative z-3 bg-white border fw-bold text-muted-theme" style="width: 40px; height: 40px; border-color: var(--border-color) !important;">3</div>
                    <div class="rounded-circle d-flex align-items-center justify-content-center position-relative z-3 bg-white border fw-bold text-muted-theme" style="width: 40px; height: 40px; border-color: var(--border-color) !important;">4</div>
                    <div class="rounded-circle d-flex align-items-center justify-content-center position-relative z-3 bg-white border fw-bold text-muted-theme" style="width: 40px; height: 40px; border-color: var(--border-color) !important;">5</div>
                    <div class="rounded-circle d-flex align-items-center justify-content-center position-relative z-3 bg-white border fw-bold text-muted-theme" style="width: 40px; height: 40px; border-color: var(--border-color) !important;">6</div>
                </div>
                
                <p class="text-center text-muted-theme fw-medium mb-5">Step 1: Personal Profile</p>

                <!-- Form Card -->
                <div class="fintech-card p-5">
                    <h2 class="h3 mb-4">Tell us about yourself</h2>
                    <p class="text-secondary-theme mb-4">This helps us customize your financial roadmap.</p>
                    
                    <form id="step1-form" data-step="1">
                        <div class="row g-4">
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Full Name</label>
                                <input type="text" class="form-control form-control-lg" name="fullName" required placeholder="John Doe">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Age</label>
                                <input type="number" class="form-control form-control-lg" name="age" required min="18" max="100" placeholder="30">
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Occupation Type</label>
                                <select class="form-select form-select-lg" name="occupationType" required>
                                    <option value="" disabled selected>Select...</option>
                                    <option value="student">Student</option>
                                    <option value="employee">Salaried Employee</option>
                                    <option value="self-employed">Self-Employed / Freelancer</option>
                                    <option value="business">Business Owner</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Profession / Job Title</label>
                                <input type="text" class="form-control form-control-lg" name="profession" required placeholder="Software Engineer">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-medium">Marital Status</label>
                                <select class="form-select form-select-lg" name="maritalStatus" required>
                                    <option value="" disabled selected>Select...</option>
                                    <option value="single">Single</option>
                                    <option value="married">Married</option>
                                    <option value="divorced">Divorced</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Number of Dependents</label>
                                <input type="number" class="form-control form-control-lg" name="dependents" required min="0" placeholder="0">
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-medium">City of Residence (Optional)</label>
                                <input type="text" class="form-control form-control-lg" name="city" placeholder="e.g. Mumbai">
                            </div>
                        </div>

                        <div class="d-flex justify-content-end mt-5">
                            <button type="submit" class="btn btn-primary-fintech px-5">Continue <i class="fas fa-arrow-right ms-2"></i></button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../../js/storage.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/planner.js"></script>
</body>
</html>
