<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Why this file exists: Provides the user interface for creating a new account. -->
    <title>Register | FutureFund</title>
    
    <!-- External CSS Dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Internal CSS -->
    <link rel="stylesheet" href="../css/main.css">
    
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            padding: 2rem;
        }
        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg, 16px);
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .auth-logo {
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--text-primary);
            text-align: center;
            margin-bottom: 2rem;
            display: block;
            text-decoration: none;
        }
        .auth-logo i { color: var(--accent-secondary); }
    </style>
</head>
<body class="bg-secondary-theme">

<div class="auth-container">
    <div class="auth-card">
        <a href="../index.html" class="auth-logo">
            <i class="fas fa-shield-alt"></i> FutureFund
        </a>
        
        <h4 class="fw-bold mb-1 text-primary-theme text-center">Create an account</h4>
        <p class="text-secondary-theme small text-center mb-4">Start your financial planning journey today.</p>

        <!-- Alert container for validation/error messages -->
        <div id="errorAlert" class="alert alert-danger d-none" style="font-size: 0.85rem; padding: 0.75rem;"></div>
        
        <!-- Alert container for success messages -->
        <div id="successAlert" class="alert alert-success d-none" style="font-size: 0.85rem; padding: 0.75rem;"></div>

        <!-- Registration Form -->
        <form id="registerForm">
            <div class="mb-3">
                <label class="form-label fw-semibold" style="font-size: 0.85rem">Full Name</label>
                <input type="text" class="form-control" id="fullName" required placeholder="John Doe">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold" style="font-size: 0.85rem">Email Address</label>
                <input type="email" class="form-control" id="email" required placeholder="john@example.com">
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-semibold" style="font-size: 0.85rem">Password</label>
                <input type="password" class="form-control" id="password" required placeholder="••••••••" minlength="6">
            </div>

            <button type="submit" class="btn btn-primary-fintech w-100 mb-3" id="registerBtn">
                Register
            </button>
            
            <p class="text-center text-secondary-theme small mb-0">
                Already have an account? <a href="login.html" style="color:var(--accent-primary);font-weight:600">Sign in</a>
            </p>
        </form>
    </div>
</div>

<!-- Scripts -->
<!-- Data Flow: Form Submit -> registerForm event listener -> FutureFundAPI.register() -> Backend /auth/register -> Success -> Redirect to Login -->
<script src="../js/api.js"></script>
<script>
    // Theme initialization to match the rest of the app
    const savedTheme = localStorage.getItem('futurefund_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);

    // DOM Elements
    const registerForm = document.getElementById('registerForm');
    const registerBtn = document.getElementById('registerBtn');
    const errorAlert = document.getElementById('errorAlert');
    const successAlert = document.getElementById('successAlert');

    /**
     * Handles the registration form submission.
     */
    registerForm.addEventListener('submit', async (e) => {
        e.preventDefault(); // Stop page reload
        
        // Grab values
        const fullName = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        // Basic frontend validation
        if (!fullName || !email || !password) {
            showError("Please fill in all fields.");
            return;
        }
        if (password.length < 6) {
            showError("Password must be at least 6 characters.");
            return;
        }

        // Show loading state
        registerBtn.disabled = true;
        registerBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Creating account...';
        errorAlert.classList.add('d-none');
        successAlert.classList.add('d-none');

        try {
            // Call the REST API wrapper (which executes fetch to /api/auth/register)
            const response = await FutureFundAPI.register(email, password, fullName);

            if (response.success) {
                // Success!
                successAlert.textContent = "Account created successfully! Redirecting to login...";
                successAlert.classList.remove('d-none');
                
                // Wait 2 seconds so the user can read the success message, then redirect
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } else {
                // Display error message returned by the backend (e.g. "Email already exists")
                showError(response.error);
                registerBtn.disabled = false;
                registerBtn.textContent = 'Register';
            }
        } catch (error) {
            showError("Network error. Please make sure the server is running.");
            registerBtn.disabled = false;
            registerBtn.textContent = 'Register';
        }
    });

    /**
     * Utility function to display errors in the alert box
     */
    function showError(msg) {
        errorAlert.textContent = msg;
        errorAlert.classList.remove('d-none');
    }
</script>
</body>
</html>
