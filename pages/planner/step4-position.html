<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutureFund | Step 4: Financial Position</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body class="bg-secondary-theme">
    
    <nav class="navbar fintech-nav py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-5 text-primary-theme d-flex align-items-center gap-2" href="../../index.html">
                <i class="fas fa-shield-alt text-success" style="color: var(--accent-secondary) !important;"></i> FutureFund Planner
            </a>
            <div class="ms-auto">
                <a href="../../index.html" class="btn btn-sm btn-outline-fintech">Save & Exit</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <!-- Progress Indicator -->
                <div class="d-flex justify-content-between align-items-center mb-4 position-relative">
                    <div class="progress position-absolute w-100" style="height: 2px; top: 50%; z-index: 1;">
                        <div class="progress-bar" role="progressbar" style="width: 60%; background-color: var(--accent-primary);"></div>
                    </div>
                    
                    <div class="rounded-circle d-flex align-items-center justify-content-center position-relative z-3 fw-bold bg-white text-primary border" style="width: 40px; height: 40px; border-color: var(--accent-primary) !important;"><i class="fas fa-check"></i></div>
                    <div class="rounded-circle d-flex align-items-center justify-content-center position-relative z-3 fw-bold bg-white text-primary border" style="width: 40px; height: 40px; border-color: var(--accent-primary) !important;"><i class="fas fa-check"></i></div>
                    <div class="rounded-circle d-flex align-items-center justify-content-center position-relative z-3 fw-bold bg-white text-primary border" style="width: 40px; height: 40px; border-color: var(--accent-primary) !important;"><i class="fas fa-check"></i></div>
                    <div class="rounded-circle d-flex align-items-center justify-content-center position-relative z-3 fw-bold" style="width: 40px; height: 40px; background-color: var(--accent-primary); color: white;">4</div>
                    <div class="rounded-circle d-flex align-items-center justify-content-center position-relative z-3 bg-white border fw-bold text-muted-theme" style="width: 40px; height: 40px; border-color: var(--border-color) !important;">5</div>
                    <div class="rounded-circle d-flex align-items-center justify-content-center position-relative z-3 bg-white border fw-bold text-muted-theme" style="width: 40px; height: 40px; border-color: var(--border-color) !important;">6</div>
                </div>
                
                <p class="text-center text-muted-theme fw-medium mb-5">Step 4: Current Financial Position</p>

                <div class="fintech-card p-5">
                    <h2 class="h3 mb-4">Your Assets and Liabilities</h2>
                    <p class="text-secondary-theme mb-4">Let's take a snapshot of where you stand today.</p>
                    
                    <form id="step4-form" data-step="4">
                        <div class="row g-4">
                            <!-- Assets -->
                            <div class="col-12">
                                <h5 class="fw-semibold text-success"><i class="fas fa-plus-circle me-2"></i>Assets (What you own)</h5>
                                <hr>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Emergency Fund (Cash / Savings Account)</label>
                                <div class="input-group">
                                    <span class="input-group-text">₹</span>
                                    <input type="number" class="form-control" name="posEmergency" min="0" value="0" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Investments (Stocks, Mutual Funds, Fixed Deposits)</label>
                                <div class="input-group">
                                    <span class="input-group-text">₹</span>
                                    <input type="number" class="form-control" name="posInvestments" min="0" value="0" required>
                                </div>
                            </div>
                            
                            <!-- Liabilities -->
                            <div class="col-12 mt-4">
                                <h5 class="fw-semibold text-danger"><i class="fas fa-minus-circle me-2"></i>Liabilities (What you owe)</h5>
                                <hr>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Total Outstanding Loans (Home, Car, Personal)</label>
                                <div class="input-group">
                                    <span class="input-group-text">₹</span>
                                    <input type="number" class="form-control" name="posLoans" min="0" value="0" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Credit Card Debt</label>
                                <div class="input-group">
                                    <span class="input-group-text">₹</span>
                                    <input type="number" class="form-control" name="posCreditCard" min="0" value="0" required>
                                </div>
                            </div>

                            <!-- Insurance -->
                            <div class="col-12 mt-4">
                                <h5 class="fw-semibold text-primary"><i class="fas fa-shield-alt me-2"></i>Protection</h5>
                                <hr>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Do you have Health Insurance?</label>
                                <select class="form-select" name="posHealthInsurance" required>
                                    <option value="yes">Yes</option>
                                    <option value="no">No</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Do you have Life Insurance? (Term Plan)</label>
                                <select class="form-select" name="posLifeInsurance" required>
                                    <option value="yes">Yes</option>
                                    <option value="no">No</option>
                                </select>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between mt-5">
                            <a href="step3-expenses.html" class="btn btn-outline-fintech">Back</a>
                            <button type="submit" class="btn btn-primary-fintech px-5">Continue <i class="fas fa-arrow-right ms-2"></i></button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../../js/storage.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/planner.js"></script>
</body>
</html>
