        }

            padding: 1rem;

                <li><a class="nav-link fw-medium active" style="color:var(--text-primary)" href="goals.html">Goals</a></li>
                <li><a class="nav-link fw-medium" style="color:var(--text-secondary)" href="expenses.html">Expenses</a></li>
                <li><a class="nav-link fw-medium" style="color:var(--text-secondary)" href="profile.html">Profile</a></li>

<header class="profile-header">
    <div class="container-xl">
        <div class="d-flex align-items-center gap-4">
            <div>
                <p style="font-size:.78rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-bottom:.25rem">Financial Planning</p>
                <h1 class="fw-bold mb-1" style="font-family:var(--font-heading);color:var(--text-primary)">Manage Goals</h1>
                <p style="color:var(--text-muted);font-size:.9rem;margin:0">Track your progress toward your financial targets.</p>
            </div>
        </div>
    </div>
</header>

<div class="container-xl py-5">
    <div class="row g-4">
        <!-- Add Goal Form -->
        <div class="col-lg-4">
            <div class="profile-card">
                <span class="section-title">Add New Goal</span>
                <form id="addGoalForm">
                    <div class="mb-3">
                        <label class="form-label fw-semibold" style="font-size:.85rem">Goal Name</label>
                        <input type="text" class="form-control" id="goalName" required placeholder="e.g. Buy a House">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" style="font-size:.85rem">Target Amount</label>
                        <input type="number" class="form-control" id="goalAmount" required min="1">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" style="font-size:.85rem">Current Saved</label>
                        <input type="number" class="form-control" id="goalSaved" value="0" min="0">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" style="font-size:.85rem">Timeline (Years)</label>
                        <input type="number" class="form-control" id="goalTimeline" required min="1" value="5">
                    </div>
                    <button type="submit" class="btn btn-primary-fintech btn-sm w-100">
                        <i class="fas fa-plus me-1"></i> Add Goal
                    </button>
                </form>
            </div>
        </div>

        <!-- Goals List -->
        <div class="col-lg-8">
            <div class="profile-card">
                <span class="section-title">Your Goals</span>
                <div id="goalsContainer">
                    <p class="text-muted small">Loading goals...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/utils.js"></script>`n<script src="../js/app.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", async () => {
        if (!window.FutureFundAPI || !localStorage.getItem("ff_jwt")) {
            window.location.href = "login.html";
            return;
        }

        const goalsContainer = document.getElementById("goalsContainer");
        const form = document.getElementById("addGoalForm");

        const loadGoals = async () => {
            const res = await FutureFundAPI.getGoals();
            if (res.success) {
                renderGoals(res.data.goals || []);
            } else {
                goalsContainer.innerHTML = `<p class="text-danger small">Failed to load goals: ${res.error || "Unknown error"}</p>`;
            }
        };

        const renderGoals = (goals) => {
            if (goals.length === 0) {
                goalsContainer.innerHTML = "<p class=\"text-muted small\">You have no goals yet. Add one to get started.</p>";
                return;
            }

            goalsContainer.innerHTML = "";
            
            // Helper function to escape HTML
            const escapeHTML = (str) => {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            };

            goals.forEach(goal => {
                const target = parseFloat(goal.target_amount);
                const saved = parseFloat(goal.current_saved);
                const progress = Math.min(100, Math.max(0, (saved / target) * 100)).toFixed(1);

                goalsContainer.innerHTML += `
                    <div class="goal-item">
                        <div class="goal-header">
                            <h5 class="mb-1" style="color:var(--text-primary)">${escapeHTML(goal.goal_name)}</h5>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteGoal(${goal.id})"><i class="fas fa-trash"></i></button>
                        </div>
                        <p class="text-muted small mb-2">Target: ${target.toLocaleString()} | Saved: ${saved.toLocaleString()} | Timeline: ${goal.timeline_years} years</p>
                        <div class="progress" style="height: 10px;">
                            <div class="progress-bar" role="progressbar" style="width: ${progress}%; background-color: var(--accent-secondary);" aria-valuenow="${progress}" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                        <p class="text-muted small mt-1 mb-0 text-end">${progress}% Achieved</p>
                    </div>
                `;
            });
        };

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const goalData = {
                goal_name: document.getElementById("goalName").value,
                target_amount: document.getElementById("goalAmount").value,
                current_saved: document.getElementById("goalSaved").value,
                timeline_years: document.getElementById("goalTimeline").value,
                category: "General"
            };

            const btn = form.querySelector("button");
            btn.disabled = true;
            btn.innerHTML = "Adding...";

            const res = await FutureFundAPI.createGoal(goalData);
            if (res.success) {
                form.reset();
                await loadGoals();
            } else {
                alert(res.error || "Failed to add goal");
            }
            btn.disabled = false;
            btn.innerHTML = "<i class=\"fas fa-plus me-1\"></i> Add Goal";
        });

        window.deleteGoal = async (id) => {
            if (confirm("Are you sure you want to delete this goal?")) {
                const res = await FutureFundAPI.deleteGoal(id);
                if (res.success) {
                    await loadGoals();
                } else {
                    alert(res.error || "Failed to delete goal");
                }
            }
        };

        loadGoals();
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
