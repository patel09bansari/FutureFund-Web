<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutureFund | Step 3: Expenses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body class="bg-secondary-theme">
    
    <nav class="navbar fintech-nav py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-5 text-primary-theme d-flex align-items-center gap-2" href="../../index.html">
                <i class="fas fa-shield-alt text-success" style="color: var(--accent-secondary) !important;"></i> FutureFund Planner
            </a>
            <div class="ms-auto">
                <a href="../../index.html" class="btn btn-sm btn-outline-fintech">Save & Exit</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <!-- Progress Indicator -->
                <div class="d-flex justify-content-between align-items-center mb-4 position-relative">
                    <div class="progress position-absolute w-100" style="height: 2px; top: 50%; z-index: 1;">
                        <div class="progress-bar" role="progressbar" style="width: 40%; background-color: var(--accent-primary);"></div>
                    </div>
                    
                    <div class="rounded-circle d-flex align-items-center justify-content-center position-relative z-3 fw-bold bg-white text-primary border" style="width: 40px; height: 40px; border-color: var(--accent-primary) !important;"><i class="fas fa-check"></i></div>
                    <div class="rounded-circle d-flex align-items-center justify-content-center position-relative z-3 fw-bold bg-white text-primary border" style="width: 40px; height: 40px; border-color: var(--accent-primary) !important;"><i class="fas fa-check"></i></div>
                    <div class="rounded-circle d-flex align-items-center justify-content-center position-relative z-3 fw-bold" style="width: 40px; height: 40px; background-color: var(--accent-primary); color: white;">3</div>
                    <div class="rounded-circle d-flex align-items-center justify-content-center position-relative z-3 bg-white border fw-bold text-muted-theme" style="width: 40px; height: 40px; border-color: var(--border-color) !important;">4</div>
                    <div class="rounded-circle d-flex align-items-center justify-content-center position-relative z-3 bg-white border fw-bold text-muted-theme" style="width: 40px; height: 40px; border-color: var(--border-color) !important;">5</div>
                    <div class="rounded-circle d-flex align-items-center justify-content-center position-relative z-3 bg-white border fw-bold text-muted-theme" style="width: 40px; height: 40px; border-color: var(--border-color) !important;">6</div>
                </div>
                
                <p class="text-center text-muted-theme fw-medium mb-5">Step 3: Monthly Expenses</p>

                <div class="row">
                    <div class="col-md-8">
                        <div class="fintech-card p-5 h-100">
                            <h2 class="h3 mb-4">Where does your money go?</h2>
                            <p class="text-secondary-theme mb-4">Categorize your monthly expenses.</p>
                            
                            <form id="step3-form" data-step="3">
                                <div class="row g-3">
                                    <div class="col-sm-6">
                                        <label class="form-label fw-medium"><i class="fas fa-home text-muted me-2"></i>Housing (Rent/EMI)</label>
                                        <div class="input-group">
                                            <span class="input-group-text">₹</span>
                                            <input type="number" class="form-control expense-input" name="expHousing" min="0" value="0" required>
                                        </div>
                                    </div>
                                    <div class="col-sm-6">
                                        <label class="form-label fw-medium"><i class="fas fa-utensils text-muted me-2"></i>Food & Groceries</label>
                                        <div class="input-group">
                                            <span class="input-group-text">₹</span>
                                            <input type="number" class="form-control expense-input" name="expFood" min="0" value="0" required>
                                        </div>
                                    </div>
                                    <div class="col-sm-6">
                                        <label class="form-label fw-medium"><i class="fas fa-car text-muted me-2"></i>Transportation</label>
                                        <div class="input-group">
                                            <span class="input-group-text">₹</span>
                                            <input type="number" class="form-control expense-input" name="expTransport" min="0" value="0" required>
                                        </div>
                                    </div>
                                    <div class="col-sm-6">
                                        <label class="form-label fw-medium"><i class="fas fa-bolt text-muted me-2"></i>Utilities & Bills</label>
                                        <div class="input-group">
                                            <span class="input-group-text">₹</span>
                                            <input type="number" class="form-control expense-input" name="expUtilities" min="0" value="0" required>
                                        </div>
                                    </div>
                                    <div class="col-sm-6">
                                        <label class="form-label fw-medium"><i class="fas fa-film text-muted me-2"></i>Entertainment</label>
                                        <div class="input-group">
                                            <span class="input-group-text">₹</span>
                                            <input type="number" class="form-control expense-input" name="expEntertainment" min="0" value="0" required>
                                        </div>
                                    </div>
                                    <div class="col-sm-6">
                                        <label class="form-label fw-medium"><i class="fas fa-book text-muted me-2"></i>Education</label>
                                        <div class="input-group">
                                            <span class="input-group-text">₹</span>
                                            <input type="number" class="form-control expense-input" name="expEducation" min="0" value="0" required>
                                        </div>
                                    </div>
                                    <div class="col-sm-6">
                                        <label class="form-label fw-medium"><i class="fas fa-heartbeat text-muted me-2"></i>Healthcare</label>
                                        <div class="input-group">
                                            <span class="input-group-text">₹</span>
                                            <input type="number" class="form-control expense-input" name="expHealthcare" min="0" value="0" required>
                                        </div>
                                    </div>
                                    <div class="col-sm-6">
                                        <label class="form-label fw-medium"><i class="fas fa-box text-muted me-2"></i>Miscellaneous</label>
                                        <div class="input-group">
                                            <span class="input-group-text">₹</span>
                                            <input type="number" class="form-control expense-input" name="expMisc" min="0" value="0" required>
                                        </div>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-between mt-5">
                                    <a href="step2-income.html" class="btn btn-outline-fintech">Back</a>
                                    <button type="submit" class="btn btn-primary-fintech px-5">Continue <i class="fas fa-arrow-right ms-2"></i></button>
                                </div>
                            </form>
                        </div>
                    </div>
                    
                    <div class="col-md-4 mt-4 mt-md-0">
                        <div class="fintech-card p-4 sticky-top" style="top: 100px;">
                            <h4 class="mb-4">Budget Analysis</h4>
                            
                            <div class="mb-3">
                                <p class="mb-1 text-secondary-theme small">Monthly Income</p>
                                <h5 class="text-primary-theme" id="summaryIncome">₹0</h5>
                            </div>
                            
                            <div class="mb-3">
                                <p class="mb-1 text-secondary-theme small">Total Expenses</p>
                                <h5 class="text-danger" id="summaryExpenses">₹0</h5>
                            </div>
                            
                            <hr class="border-secondary opacity-25">
                            
                            <div>
                                <p class="mb-1 text-secondary-theme small">Savings Potential</p>
                                <h3 class="fw-bold text-success" id="summarySavings">₹0</h3>
                            </div>
                            <div class="progress mt-3" style="height: 6px;">
                                <div id="savingsProgress" class="progress-bar bg-success" role="progressbar" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../../js/storage.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/planner.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.expense-input');
            const summaryIncome = document.getElementById('summaryIncome');
            const summaryExpenses = document.getElementById('summaryExpenses');
            const summarySavings = document.getElementById('summarySavings');
            const savingsProgress = document.getElementById('savingsProgress');
            
            // Get income from step 2
            const step2Data = FutureFundStorage.get('planner_step2') || {};
            const totalIncome = (parseFloat(step2Data.primaryIncome) || 0) + (parseFloat(step2Data.additionalIncome) || 0);
            
            summaryIncome.textContent = FutureFundUtils.formatCurrency(totalIncome);
            
            function updateSummary() {
                let totalExp = 0;
                inputs.forEach(input => {
                    totalExp += parseFloat(input.value) || 0;
                });
                
                const savings = totalIncome - totalExp;
                
                summaryExpenses.textContent = FutureFundUtils.formatCurrency(totalExp);
                summarySavings.textContent = FutureFundUtils.formatCurrency(savings);
                
                if (savings < 0) {
                    summarySavings.classList.replace('text-success', 'text-danger');
                    savingsProgress.style.width = '0%';
                } else {
                    summarySavings.classList.replace('text-danger', 'text-success');
                    const ratio = totalIncome > 0 ? (savings / totalIncome) * 100 : 0;
                    savingsProgress.style.width = `${Math.min(ratio, 100)}%`;
                }
            }
            
            inputs.forEach(input => input.addEventListener('input', updateSummary));
            
            setTimeout(updateSummary, 100);
        });
    </script>
</body>
</html>
