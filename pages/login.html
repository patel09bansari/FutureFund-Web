<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Why this file exists: Provides the user interface for authenticating with the backend API. -->
    <title>Login | FutureFund</title>
    
    <!-- External CSS Dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Internal CSS -->
    <link rel="stylesheet" href="../css/main.css">
    
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            padding: 2rem;
        }
        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg, 16px);
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .auth-logo {
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--text-primary);
            text-align: center;
            margin-bottom: 2rem;
            display: block;
            text-decoration: none;
        }
        .auth-logo i { color: var(--accent-secondary); }
    </style>
</head>
<body class="bg-secondary-theme">

<div class="auth-container">
    <div class="auth-card">
        <a href="../index.html" class="auth-logo">
            <i class="fas fa-shield-alt"></i> FutureFund
        </a>
        
        <h4 class="fw-bold mb-1 text-primary-theme text-center">Welcome back</h4>
        <p class="text-secondary-theme small text-center mb-4">Enter your credentials to access your account.</p>

        <!-- Alert container for validation/error messages -->
        <div id="errorAlert" class="alert alert-danger d-none" style="font-size: 0.85rem; padding: 0.75rem;"></div>

        <!-- Login Form -->
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label fw-semibold" style="font-size: 0.85rem">Email Address</label>
                <input type="email" class="form-control" id="email" required placeholder="john@example.com">
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-semibold" style="font-size: 0.85rem">Password</label>
                <input type="password" class="form-control" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-primary-fintech w-100 mb-3" id="loginBtn">
                Sign In
            </button>
            
            <p class="text-center text-secondary-theme small mb-0">
                Don't have an account? <a href="register.html" style="color:var(--accent-primary);font-weight:600">Register</a>
            </p>
        </form>
    </div>
</div>

<!-- Scripts -->
<!-- Data Flow: Form Submit -> loginForm event listener -> FutureFundAPI.login() -> Backend /auth/login -> JWT returned -> localStorage -> Redirect -->
<script src="../js/api.js"></script>
<script>
    // Theme initialization to match the rest of the app
    const savedTheme = localStorage.getItem('futurefund_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);

    // DOM Elements
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const errorAlert = document.getElementById('errorAlert');

    /**
     * Handles the login form submission.
     * Prevents default page reload, grabs inputs, and calls the API.
     */
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault(); // Stop page reload
        
        // Grab values
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        // Basic frontend validation
        if (!email || !password) {
            showError("Please fill in all fields.");
            return;
        }

        // Show loading state
        loginBtn.disabled = true;
        loginBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Signing in...';
        errorAlert.classList.add('d-none');

        try {
            // Call the REST API wrapper (which executes fetch to /api/auth/login)
            const response = await FutureFundAPI.login(email, password);

            if (response.success) {
                // Success! Store the JWT token securely in localStorage
                // The key 'ff_jwt' is read by api.js to authenticate future requests
                localStorage.setItem('ff_jwt', response.data.token);
                
                // Store basic user data for profile rendering
                localStorage.setItem('ff_user', JSON.stringify(response.data.user));
                
                // Redirect to the dashboard
                window.location.href = 'dashboard.html';
            } else {
                // Display error message returned by the backend (e.g. "Invalid credentials")
                showError(response.error);
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        } catch (error) {
            showError("Network error. Please make sure the server is running.");
            loginBtn.disabled = false;
            loginBtn.textContent = 'Sign In';
        }
    });

    /**
     * Utility function to display errors in the alert box
     */
    function showError(msg) {
        errorAlert.textContent = msg;
        errorAlert.classList.remove('d-none');
    }
</script>
</body>
</html>
